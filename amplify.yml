# Build de Amplify Hosting para el juego (sitio estático).
# Los assets ya vienen generados en public/assets y src/data, así que acá sólo se compila.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
