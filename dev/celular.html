<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vista en celular — Ajedrez y Leyendas</title>
<style>
  body { margin: 0; min-height: 100vh; background: #1c2426; color: #e8e2cc; font: 15px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 18px; box-sizing: border-box; }
  h1 { margin: 0; font-size: 20px; }
  .row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; justify-content: center; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .phone { background: #000; border-radius: 34px; padding: 12px; box-shadow: 0 0 0 2px #555, 0 12px 30px #0008; }
  iframe { display: block; border: 0; border-radius: 22px; background: #000; }
  figcaption { opacity: .8; }
</style>
</head>
<body>
  <h1>Así se ve en un celular (iPhone 14: 390 × 844)</h1>
  <div class="row">
    <figure><div class="phone"><iframe src="/" width="390" height="664" title="Celular vertical"></iframe></div><figcaption>Vertical</figcaption></figure>
    <figure><div class="phone"><iframe src="/" width="750" height="390" title="Celular de costado"></iframe></div><figcaption>De costado</figcaption></figure>
  </div>
</body>
</html>
